name: Java CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Compile Java code
      run: |
        mkdir -p out
        javac -d out $(find . -name "*.java")

    - name: Run Java tests
      run: |
        # إذا عندك ملفات main لتشغيلها، ضع اسم الكلاس هنا
        # مثال: java -cp out Main
        echo "Tests can be run here if you have a test framework like JUnit"
